[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hold-my-data"
version = "0.2.3"
description = "Local PII and secret redaction"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "presidio-analyzer==2.2.362",
  "presidio-anonymizer==2.2.362",
  "gliner==0.2.28",
  "pyyaml==6.0.2",
  "paddlepaddle==3.3.1",
  "paddleocr==3.7.0",
  "rich==15.0.0",
  "pypdfium2==5.13.0",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
hold-my-data = "holdmydata.cli:main"

[project.urls]
Homepage = "https://github.com/gititya/hold-my-data"
Repository = "https://github.com/gititya/hold-my-data"
Issues = "https://github.com/gititya/hold-my-data/issues"

[tool.setuptools.packages.find]
include = ["holdmydata*"]

[tool.setuptools.data-files]
config = ["config/patterns.yaml", "config/rules.yaml", "config/taxonomy.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
